AWSTemplateFormatVersion: '2010-09-09'
Description: Private static admin frontend and /api proxy, isolated by environment

Parameters:
  EnvironmentName:
    Type: String
    Default: staging
    AllowedValues: [staging, production]
  CertificateArn:
    Type: String
    Default: ''
    Description: Existing ACM certificate ARN in us-east-1; leave empty for CloudFront staging domain.
  AdminHostname:
    Type: String
    Default: ''
    Description: Custom hostname, e.g. auth.albertsanfle.com; leave empty for staging.
  ApiDomainName:
    Type: String
    Description: API Gateway domain only, e.g. abc.execute-api.us-east-1.amazonaws.com

Conditions:
  HasAlias: !Not [!Equals [!Ref AdminHostname, '']]

Rules:
  AliasNeedsCertificate:
    Assertions:
      - Assert: !Or [!Equals [!Ref AdminHostname, ''], !Not [!Equals [!Ref CertificateArn, '']]]
        AssertDescription: A custom hostname requires an ACM certificate ARN.

Resources:
  AdminBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
      OwnershipControls:
        Rules:
          - { ObjectOwnership: BucketOwnerEnforced }
      Tags:
        - { Key: Project, Value: AlbertSanfleCMS }
        - { Key: Environment, Value: !Ref EnvironmentName }

  AdminAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-admin-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AdminRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-spa-rewrite'
      AutoPublish: true
      FunctionConfig: { Comment: SPA routes to index.html, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.startsWith('/lambda-artifacts/'))
            return { statusCode: 404, statusDescription: 'Not Found' };
          if (request.uri === '/') return { statusCode: 302, statusDescription: 'Found',
            headers: { location: { value: '/admin' } } };
          if (!request.uri.startsWith('/api/') && !request.uri.includes('.')) request.uri = '/index.html';
          return request;
        }

  StaticCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${AWS::StackName}-static-cache'
        DefaultTTL: 300
        MinTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  AdminDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - { Key: Project, Value: AlbertSanfleCMS }
        - { Key: Environment, Value: !Ref EnvironmentName }
      DistributionConfig:
        Enabled: true
        Aliases: !If [HasAlias, [!Ref AdminHostname], !Ref 'AWS::NoValue']
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - HasAlias
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: admin-static
            DomainName: !GetAtt AdminBucket.RegionalDomainName
            OriginPath: /site
            S3OriginConfig: { OriginAccessIdentity: '' }
            OriginAccessControlId: !GetAtt AdminAccess.Id
          - Id: cms-api
            DomainName: !Ref ApiDomainName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
              OriginSSLProtocols: [TLSv1.2]
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: admin-static
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref StaticCache
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AdminRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: cms-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  AdminBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${AdminBucket.Arn}/site/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${AdminDistribution}'

Outputs:
  AdminBucketName:
    Value: !Ref AdminBucket
  CloudFrontDomain:
    Value: !GetAtt AdminDistribution.DomainName
  DistributionId:
    Value: !Ref AdminDistribution
