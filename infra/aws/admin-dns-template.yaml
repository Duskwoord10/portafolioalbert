AWSTemplateFormatVersion: '2010-09-09'
Description: Production admin DNS cutover only after API, certificate and CloudFront verification

Parameters:
  HostedZoneId:
    Type: String
    AllowedPattern: '^Z[A-Z0-9]+$'
  AdminCloudFrontDomain:
    Type: String
    AllowedPattern: '^d[a-z0-9]+\.cloudfront\.net$'

Resources:
  AdminAliasA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: auth.albertsanfle.com.
      Type: A
      AliasTarget:
        DNSName: !Ref AdminCloudFrontDomain
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
  AdminAliasAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: auth.albertsanfle.com.
      Type: AAAA
      AliasTarget:
        DNSName: !Ref AdminCloudFrontDomain
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false
